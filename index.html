<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Overload">
<meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Overload</title>
<style>
:root{--bg:#f7f7f8;--card:#fff;--soft:#f1f1f4;--fg:#111113;--fg2:#3c3c43;--muted:#8a8a93;--line:#ececf0;--ac:#4f46e5;--acs:rgba(79,70,229,.12);--btn:#111113;--btnfg:#fff;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);--glass:rgba(247,247,248,.82)}
@media (prefers-color-scheme:dark){:root{--bg:#0b0b0c;--card:#161618;--soft:#212124;--fg:#f5f5f6;--fg2:#c9c9cf;--muted:#85858e;--line:#26262a;--ac:#7174f3;--acs:rgba(113,116,243,.18);--btn:#f5f5f6;--btnfg:#0b0b0c;--shadow:none;--glass:rgba(11,11,12,.82)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
main{padding:calc(env(safe-area-inset-top) + 10px) 20px calc(env(safe-area-inset-bottom) + 160px);max-width:560px;margin:0 auto}
.page[hidden]{display:none}
/* ---------- type hierarchy ---------- */
.eyebrow{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.2px}
h1{font-size:34px;line-height:1.1;letter-spacing:-.8px;margin:2px 0 18px;font-weight:800}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:28px 2px 10px}
.sec h3{font-size:20px;letter-spacing:-.3px;margin:0;font-weight:700}
.sec span{font-size:13px;color:var(--muted)}
.sub{font-size:13px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
/* ---------- surfaces ---------- */
.card{background:var(--card);border-radius:22px;padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}
.card.flat{padding:4px 18px}
/* ---------- controls ---------- */
button{font:inherit;border:0;border-radius:14px;padding:10px 14px;background:var(--soft);color:var(--fg);cursor:pointer}
button:active{opacity:.7}
.btn{width:100%;padding:16px;border-radius:16px;background:var(--btn);color:var(--btnfg);font-weight:700;font-size:17px}
.link{background:none;color:var(--muted);font-size:14px;padding:8px}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;padding:8px 12px;border-radius:11px;background:none;color:var(--muted);font-weight:600;font-size:15px}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.sm button{font-size:13px;padding:6px 10px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px 14px;padding:0 20px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 14px;border-radius:999px;background:var(--card);color:var(--fg2);font-weight:600;font-size:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.chip.on{background:var(--btn);color:var(--btnfg);border-color:transparent}
input,select{width:100%;font:inherit;color:var(--fg);background:var(--soft);border:1.5px solid transparent;border-radius:12px;padding:11px 8px;text-align:center;-webkit-appearance:none;appearance:none;outline:none;font-variant-numeric:tabular-nums}
input:focus{border-color:var(--ac);background:var(--card)}
input::placeholder{color:var(--muted);opacity:.6}
input.txt{text-align:left}
select{text-align:left;padding:12px}
.datebtn{position:relative;display:inline-flex;align-items:center;gap:4px}
.datebtn input{position:absolute;inset:0;opacity:0}
/* ---------- gym ---------- */
.prog{display:flex;align-items:center;gap:10px;margin:14px 2px 0}
.prog .bar{flex:1;height:4px;background:var(--soft);border-radius:4px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--ac);border-radius:4px;transition:width .3s}
.pair-t{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.8px;margin:24px 4px 8px;text-transform:uppercase}
.ex-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.ex-n{font-weight:700;font-size:18px;letter-spacing:-.2px}
.tot{text-align:right;white-space:nowrap}
.tot .n{font-size:28px;font-weight:800;line-height:1;letter-spacing:-.5px}
.tot .n.up{color:var(--ac)}
.tot .n small{font-size:14px;color:var(--muted);font-weight:600;letter-spacing:0}
.cols,.row{display:grid;grid-template-columns:24px 1.4fr 1fr 64px;gap:8px;align-items:center}
.nw .cols,.nw .row{grid-template-columns:24px 1.4fr 64px}
.cols{font-size:11px;color:var(--muted);margin-bottom:6px;text-align:center;font-weight:600}
.row{margin-bottom:8px}
.no{font-size:13px;font-weight:700;color:var(--muted);text-align:center}
.row.done .no{color:var(--ac)}
.row.done .reps{background:var(--acs)}
.reps{font-size:22px;font-weight:700;padding:12px 6px}
.w{font-size:17px;font-weight:600}
.rest{font-size:14px;color:var(--fg2);background:none;border:1.5px solid var(--line);padding:9px 4px}
.fld{position:relative}
.fld i{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-style:normal;font-size:11px;color:var(--muted);pointer-events:none}
.fld .w{padding-right:24px}
.setbtns{display:flex;gap:8px}
.addset{flex:1;width:100%;background:none;color:var(--muted);font-size:14px;padding:8px;margin-top:2px}
.fab{position:fixed;left:20px;right:20px;bottom:calc(env(safe-area-inset-bottom) + 76px);max-width:520px;margin:0 auto;padding:16px;border-radius:18px;background:var(--btn);color:var(--btnfg);font-weight:700;font-size:17px;box-shadow:0 8px 28px rgba(0,0,0,.22);transition:transform .25s,opacity .25s;z-index:5}
.fab.hide{transform:translateY(160%);opacity:0;pointer-events:none}
/* ---------- run ---------- */
.big{font-size:52px;font-weight:800;text-align:center;letter-spacing:-1.5px;line-height:1;margin:4px 0}
.g3{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px}
.g3 input{font-size:20px;font-weight:700;padding:13px 6px}
.lbl{font-size:12px;color:var(--muted);text-align:center;margin-top:5px}
/* ---------- lists ---------- */
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{font-weight:600}
.li .v{font-weight:800;font-size:20px;letter-spacing:-.3px}
.x{background:none;color:var(--muted);padding:6px;font-size:18px;line-height:1;opacity:.6}
.empty{text-align:center;color:var(--muted);padding:28px 10px;font-size:14px}
/* ---------- stats / kpi ---------- */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.kpi .k{font-size:12px;color:var(--muted);margin-top:3px}
.kpi .d{font-size:12px;font-weight:600;margin-top:4px;color:var(--fg2)}
.kpi .d b{color:var(--ac)}
.chart{position:relative;margin-top:10px;touch-action:pan-y}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font:11px -apple-system,BlinkMacSystemFont,sans-serif;fill:var(--muted)}
.tip{position:absolute;top:-6px;transform:translateX(-50%);background:var(--btn);color:var(--btnfg);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:600;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.tip small{display:block;font-weight:500;opacity:.7;font-size:11px}
.ctitle{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ctitle b{font-size:15px}
.legend{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.heat div{aspect-ratio:1;border-radius:3px;background:var(--soft)}
.heat .l1{background:var(--ac);opacity:.45}
.heat .l2{background:var(--ac)}
.heat .fut{background:none}
.heat .today{outline:1.5px solid var(--fg);outline-offset:-1.5px}
/* ---------- settings ---------- */
.edrow{display:flex;align-items:center;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.edrow:last-child{border-bottom:0}
.edrow span{flex:1}
.mini{padding:6px 10px;font-size:13px;border-radius:10px}
/* ---------- nav / toast ---------- */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--glass);backdrop-filter:blur(20px) saturate(1.8);-webkit-backdrop-filter:blur(20px) saturate(1.8);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;border-radius:0;padding:9px 0 7px;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--fg)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);transform:translate(-50%,-160%);background:var(--btn);color:var(--btnfg);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;transition:transform .3s;z-index:9;white-space:nowrap}
.toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<main>
  <section class="page" id="p-gym"></section>
  <section class="page" id="p-run" hidden></section>
  <section class="page" id="p-stat" hidden></section>
  <section class="page" id="p-set" hidden></section>
</main>
<button class="fab hide" id="fab"></button>
<nav>
  <button data-t="gym" class="on"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>ยิม</button>
  <button data-t="run"><svg viewBox="0 0 24 24"><circle cx="14.5" cy="4.5" r="1.8"/><path d="M7.5 21l3-6 3 2 1 4M6 11.5l3-3.5 4 1 2 3 3 1M10.5 15l1.5-5"/></svg>วิ่ง</button>
  <button data-t="stat"><svg viewBox="0 0 24 24"><path d="M3 20h18M6 16v-4M11 16V7M16 16v-6M21 4l-5 5-4-3-6 5"/></svg>สถิติ</button>
  <button data-t="set"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></svg>ตั้งค่า</button>
</nav>
<div class="toast" id="toast"></div>
<input type="file" id="imp" accept="application/json,.json" hidden>

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>ymd(new Date());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
const fmtW=w=>w==null?'':(+(+w).toFixed(2)).toString();
const fmtN=n=>(Math.round(n*10)/10).toLocaleString('en-US');
const fmtSec=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?h+':'+pad(m)+':'+pad(x):m+':'+pad(x)};
function fmtDate(s,long){if(!s)return 'บันทึกเก่า';if(s===today())return 'วันนี้';const yd=new Date();yd.setDate(yd.getDate()-1);if(s===ymd(yd))return 'เมื่อวาน';return pd(s).toLocaleDateString('th-TH',long?{weekday:'long',day:'numeric',month:'short'}:{day:'numeric',month:'short'})}
const weekStart=s=>{const d=pd(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return ymd(d)};
const skey=o=>(o.date||'0000-00-00')+'|'+String(o.ts).padStart(15,'0');
const total=sets=>sets.reduce((a,s)=>a+(num(s.r)||0),0);
const UL=()=>(D.unit||'mi')==='mi'?'ไมล์':'กม.';

let D=load();
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.exercises)return d}catch(e){}return JSON.parse(JSON.stringify(SEED||{v:1,unit:'mi',exercises:[],days:[],sessions:[],runs:[],draft:null}))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('บันทึกไม่สำเร็จ')}if(typeof markDirty==='function')markDirty()}

try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800)}
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}};
const EX=id=>D.exercises.find(e=>e.id===id);
const exSessions=id=>D.sessions.filter(s=>s.exId===id).sort((a,b)=>skey(a).localeCompare(skey(b)));
function lastSess(id){let b=null;for(const s of D.sessions)if(s.exId===id&&(!b||skey(s)>skey(b)))b=s;return b}
function setsTxt(sets,weighted){const r=sets.map(s=>s.r).join(' · ');if(!weighted)return r;const ws=[...new Set(sets.map(s=>s.w))];if(ws.length===1)return r+'  @ '+fmtW(ws[0])+' kg';return sets.map(s=>s.r+'@'+fmtW(s.w)).join(' · ')}

/* =============== charts (SVG, single series) =============== */
function niceTicks(mn,mx,n=3){const span=mx-mn||1,step0=span/n,mag=Math.pow(10,Math.floor(Math.log10(step0))),f=step0/mag,step=(f<1.5?1:f<3?2:f<7?5:10)*mag;const a=Math.floor(mn/step)*step,b=Math.ceil(mx/step)*step,t=[];for(let v=a;v<=b+step/2;v+=step)t.push(+v.toFixed(6));return t}
function chart(el,pts,o={}){ // pts:[{v,label,sub}]
  const W=el.clientWidth||320,H=o.h||170,L=34,R=8,T=26,B=22,pw=W-L-R,ph=H-T-B;
  if(!pts.length){el.innerHTML=`<div class="empty">ยังไม่มีข้อมูล</div>`;return}
  const vs=pts.map(p=>p.v);let mn=o.bar?0:Math.min(...vs),mx=Math.max(...vs);if(mn===mx){mn=o.bar?0:mn-1;mx=mx+1}
  const ticks=niceTicks(mn,mx);mn=ticks[0];mx=ticks[ticks.length-1];
  const Y=v=>{const r=(v-mn)/(mx-mn);return T+(o.invert?r:1-r)*ph};
  const n=pts.length,X=i=>o.bar?L+pw*(i+.5)/n:L+(n===1?pw/2:i*pw/(n-1));
  let g='';
  ticks.forEach(t=>{const y=Y(t);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y+4}" text-anchor="end">${o.fmt?o.fmt(t):fmtN(t)}</text>`});
  const lab=i=>`<text x="${Math.min(Math.max(X(i),L+14),W-R-14)}" y="${H-4}" text-anchor="middle">${esc(pts[i].label)}</text>`;
  g+=lab(0);if(n>1)g+=lab(n-1);
  let marks='';
  if(o.bar){const bw=Math.max(3,Math.min(28,pw/n-2));const base=Y(0);
    pts.forEach((p,i)=>{const y=Y(p.v),h=Math.max(0,base-y),x=X(i)-bw/2,r=Math.min(4,bw/2,h);
      marks+=`<path d="M${x},${base}V${y+r}Q${x},${y} ${x+r},${y}H${x+bw-r}Q${x+bw},${y} ${x+bw},${y+r}V${base}Z" fill="var(--ac)" opacity="${i===n-1?1:.55}"/>`})}
  else{const d=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+','+Y(p.v).toFixed(1)).join('');
    const base=o.invert?T:T+ph;
    marks+=`<path d="${d}L${X(n-1)},${base}L${X(0)},${base}Z" fill="var(--ac)" opacity=".08"/><path d="${d}" fill="none" stroke="var(--ac)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    marks+=`<circle cx="${X(n-1)}" cy="${Y(vs[n-1])}" r="4.5" fill="var(--ac)" stroke="var(--card)" stroke-width="2"/>`}
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" height="${H}">${g}${marks}<line class="guide" y1="${T}" y2="${T+ph}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" opacity="0"/><circle class="hdot" r="5" fill="var(--ac)" stroke="var(--card)" stroke-width="2" opacity="0"/><rect x="${L}" y="0" width="${pw}" height="${H}" fill="transparent"/></svg><div class="tip"></div>`;
  const svg=el.querySelector('svg'),tip=el.querySelector('.tip'),gd=svg.querySelector('.guide'),hd=svg.querySelector('.hdot');
  const show=e=>{const r=svg.getBoundingClientRect(),px=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
    let i=o.bar?Math.floor((px-L)/pw*n):Math.round((px-L)/pw*(n-1));i=Math.max(0,Math.min(n-1,i));const x=X(i),y=Y(pts[i].v);
    gd.setAttribute('x1',x);gd.setAttribute('x2',x);gd.setAttribute('opacity',o.bar?0:.6);
    if(!o.bar){hd.setAttribute('cx',x);hd.setAttribute('cy',y);hd.setAttribute('opacity',1)}
    tip.innerHTML=`${o.tfmt?o.tfmt(pts[i].v):fmtN(pts[i].v)}<small>${esc(pts[i].sub||pts[i].label)}</small>`;tip.style.left=Math.min(Math.max(x,50),W-50)+'px';tip.classList.add('on')};
  const hide=()=>{tip.classList.remove('on');gd.setAttribute('opacity',0);hd.setAttribute('opacity',0)};
  svg.addEventListener('pointerdown',show);svg.addEventListener('pointermove',show);svg.addEventListener('pointerleave',hide);svg.addEventListener('touchmove',show,{passive:true});svg.addEventListener('touchend',()=>setTimeout(hide,1200));
}

/* =============== ยิม =============== */
let gymDay=null;
function draft(){if(!D.draft)D.draft={date:today(),data:{}};return D.draft}
const filled=rows=>rows.some(r=>num(r.r)>0);
function draftCount(){return D.draft?Object.values(D.draft.data).filter(filled).length:0}
function rowsFor(ex){
  if(D.draft&&D.draft.data[ex.id])return D.draft.data[ex.id];
  const last=lastSess(ex.id),n=Math.max(3,last?last.sets.length:0);
  return Array.from({length:n},(_,i)=>{const p=last&&(last.sets[i]||last.sets[last.sets.length-1]);return {r:'',w:p&&p.w!=null?fmtW(p.w):'',rest:p&&p.rest!=null?String(p.rest):(i===n-1?'0':'3')}});
}
function exCard(ex){
  const last=lastSess(ex.id),rows=rowsFor(ex),cur=total(rows),lt=last?total(last.sets):0;
  let h=`<div class="card ${ex.weighted?'':'nw'}"><div class="ex-h"><div style="min-width:0"><div class="ex-n">${esc(ex.name)}</div><div class="sub num">${last?'ครั้งก่อน '+esc(setsTxt(last.sets,ex.weighted)):'ยังไม่มีบันทึก'}</div></div>
  <div class="tot num"><div class="n ${cur>lt&&cur?'up':''}" data-tot="${ex.id}">${cur||0}${last?`<small> / ${lt}</small>`:''}</div></div></div>
  <div class="cols"><span></span><span>ครั้ง</span>${ex.weighted?'<span>kg</span>':''}<span>พัก (นาที)</span></div>`;
  rows.forEach((r,i)=>{const p=last&&last.sets[i];
    h+=`<div class="row ${num(r.r)>0?'done':''}"><div class="no">${i+1}</div>
    <input class="reps" inputmode="numeric" pattern="[0-9]*" data-ex="${ex.id}" data-i="${i}" data-k="r" value="${esc(r.r)}" placeholder="${p?p.r:'–'}">
    ${ex.weighted?`<input class="w" inputmode="decimal" data-ex="${ex.id}" data-i="${i}" data-k="w" value="${esc(r.w)}" placeholder="0">`:''}
    <input class="rest" inputmode="decimal" data-ex="${ex.id}" data-i="${i}" data-k="rest" value="${esc(r.rest)}"></div>`});
  return h+`<div class="setbtns">${rows.length>1?`<button class="addset" data-del="${ex.id}">− ลบเซ็ต</button>`:''}<button class="addset" data-add="${ex.id}">+ เพิ่มเซ็ต</button></div></div>`;
}
function renderGym(){
  const days=D.days;if(!days.find(d=>d.id===gymDay))gymDay=days[0]&&days[0].id;
  const day=days.find(d=>d.id===gymDay),date=D.draft?D.draft.date:today();
  const exs=day?day.ex.map(EX).filter(Boolean):[],done=exs.filter(e=>D.draft&&D.draft.data[e.id]&&filled(D.draft.data[e.id])).length;
  let h=`<label class="eyebrow datebtn">${fmtDate(date,1)} ▾<input type="date" id="gdate" value="${date}"></label><h1>ยิม</h1>
  <div class="seg">${days.map(d=>`<button data-day="${d.id}" class="${d.id===gymDay?'on':''}">${esc(d.name)}</button>`).join('')}</div>`;
  if(!day)h+=`<div class="empty">ยังไม่มีตาราง เพิ่มได้ที่แท็บตั้งค่า</div>`;
  else if(!exs.length)h+=`<div class="empty">วันนี้ยังไม่มีท่า เพิ่มได้ที่แท็บตั้งค่า</div>`;
  else{h+=`<div class="prog"><div class="bar"><i id="pbar" style="width:${done/exs.length*100}%"></i></div><span class="sub num" id="ptxt">${done}/${exs.length} ท่า</span></div>`;
    for(let i=0;i<exs.length;i+=2)h+=`<div class="pair-t">คู่ที่ ${i/2+1}</div>${exCard(exs[i])}${exs[i+1]?exCard(exs[i+1]):''}`;
    if(draftCount())h+=`<button class="link" style="width:100%" data-act="discard">ล้างที่กรอกไว้</button>`}
  $('#p-gym').innerHTML=h;updFab();
}

/* =============== สถิติ =============== */
let statTab='gym',statEx=null,statMetric='reps',runMetric='pace',showAll=false;
function heatmap(){
  const weeks=16,start=pd(weekStart(today()));start.setDate(start.getDate()-7*(weeks-1));
  const act={};D.sessions.forEach(s=>{if(s.date)(act[s.date]=act[s.date]||{}).g=1});D.runs.forEach(r=>{if(r.date)(act[r.date]=act[r.date]||{}).r=1});
  const t=today();let cells='',days=0;const ws=weekStart(t);let wk=0;
  for(let i=0;i<weeks*7;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=ymd(d),a=act[k],lv=a?(a.g&&a.r?2:1):0;
    if(k>t)cells+=`<div class="fut"></div>`;else{cells+=`<div class="${lv?'l'+lv:''} ${k===t?'today':''}" data-hd="${k}"></div>`;if(lv&&k>=ws)wk++}}
  return {cells,wk};
}
function renderStat(){
  const ws=weekStart(today()),hm=heatmap();
  const wRuns=D.runs.filter(r=>r.date&&r.date>=ws),wMi=wRuns.reduce((a,r)=>a+r.dist,0),wGym=new Set(D.sessions.filter(s=>s.date&&s.date>=ws).map(s=>s.date)).size;
  let h=`<div class="eyebrow">สัปดาห์นี้</div><h1>สถิติ</h1>
  <div class="kpis"><div class="kpi"><div class="v num">${wGym}</div><div class="k">วันเข้ายิม</div></div><div class="kpi"><div class="v num">${wRuns.length}</div><div class="k">ครั้งที่วิ่ง</div></div><div class="kpi"><div class="v num">${fmtN(wMi)}</div><div class="k">${UL()}</div></div></div>
  <div class="card"><div class="ctitle"><b>ความสม่ำเสมอ</b><span class="sub">16 สัปดาห์</span></div><div class="heat" style="margin-top:12px">${hm.cells}</div>
  <div class="legend"><span><i style="background:var(--soft)"></i>ไม่ได้เล่น</span><span><i style="background:var(--ac);opacity:.45"></i>ยิมหรือวิ่ง</span><span><i style="background:var(--ac)"></i>ทั้งสองอย่าง</span></div></div>
  <div class="seg" style="margin:26px 0 14px"><button data-st="gym" class="${statTab==='gym'?'on':''}">ยิม</button><button data-st="run" class="${statTab==='run'?'on':''}">วิ่ง</button></div>`;
  if(statTab==='gym'){
    const exs=D.exercises;if(!exs.find(e=>e.id===statEx))statEx=exs[0]&&exs[0].id;const ex=EX(statEx);
    h+=`<div class="chips">${exs.map(e=>`<button class="chip ${e.id===statEx?'on':''}" data-sx="${e.id}">${esc(e.name)}</button>`).join('')}</div>`;
    if(!ex){$('#p-stat').innerHTML=h+`<div class="empty">ยังไม่มีท่า</div>`;return}

    const names={reps:'ครั้งรวม',top:'น้ำหนักสูงสุด',vol:'Volume'},unit={reps:'ครั้ง',top:'kg',vol:'kg'};
    const vals=ss.map(M[statMetric]),lastV=vals[vals.length-1],prevV=vals[vals.length-2],best=vals.length?Math.max(...vals):0,diff=lastV!=null&&prevV!=null?lastV-prevV:null;
    h+=`<div class="kpis"><div class="kpi"><div class="v num">${lastV!=null?fmtN(lastV):'–'}</div><div class="k">ล่าสุด</div>${diff!=null?`<div class="d num">${diff>0?'<b>▲</b> +':diff<0?'▼ ':'= '}${fmtN(diff)}</div>`:''}</div>

    <div class="sec"><h3>บันทึก</h3><span>${ss.length} ครั้ง</span></div><div class="card flat">`;
    if(!ss.length)h+=`<div class="empty">ยังไม่มีบันทึกของท่านี้</div>`;

    shown.forEach(s=>{h+=`<div class="li"><div style="min-width:0"><div class="t num">${esc(setsTxt(s.sets,ex.weighted))}</div><div class="sub">${fmtDate(s.date)}${s.sets.some(x=>x.rest!=null)?' · พัก '+s.sets.map(x=>x.rest??'-').join('/')+' นาที':''}</div></div><div style="display:flex;align-items:center;gap:2px"><div class="v num">${total(s.sets)}</div><button class="x" data-delsess="${s.id}">×</button></div></div>`});

    chart($('#c1'),pts,{tfmt:v=>fmtN(v)+' '+unit[statMetric]});
  }else{
    const rs=runsAsc(),best=rs.length?Math.min(...rs.map(r=>r.pace)):null,sum=rs.reduce((a,r)=>a+r.dist,0),avg=rs.length?rs.reduce((a,r)=>a+r.pace*r.dist,0)/sum:null;
    h+=`<div class="kpis"><div class="kpi"><div class="v num">${best?fmtSec(best):'–'}</div><div class="k">pace ดีที่สุด</div></div><div class="kpi"><div class="v num">${avg?fmtSec(avg):'–'}</div><div class="k">pace เฉลี่ย</div></div><div class="kpi"><div class="v num">${fmtN(sum)}</div><div class="k">${UL()} ทั้งหมด</div></div></div>
    <div class="card"><div class="ctitle"><b>แนวโน้ม</b><span class="sub">${runMetric==='pace'?'เส้นสูง = เร็วขึ้น':'แตะกราฟเพื่อดูค่า'}</span></div><div class="seg sm" style="margin-top:12px"><button data-rmx="pace" class="${runMetric==='pace'?'on':''}">Pace</button><button data-rmx="dist" class="${runMetric==='dist'?'on':''}">ระยะทาง</button></div><div class="chart" id="c1"></div></div>`;
    $('#p-stat').innerHTML=h;
    const pts=rs.map((r,i)=>({v:runMetric==='pace'?r.pace:r.dist,label:r.date?fmtDate(r.date):'#'+(i+1),sub:(r.date?fmtDate(r.date):'บันทึกเก่า #'+(i+1))+' · '+(runMetric==='pace'?r.dist.toFixed(2)+' '+UL():fmtSec(r.pace)+'/'+UL())}));

  }

$('#p-stat').addEventListener('click',e=>{const hd=e.target.closest('[data-hd]');
  if(hd){const k=hd.dataset.hd,g=D.sessions.filter(s=>s.date===k).length,r=D.runs.filter(x=>x.date===k);toast(fmtDate(k)+' · '+(g||r.length?[g?'ยิม '+g+' ท่า':'',r.length?'วิ่ง '+fmtN(r.reduce((a,x)=>a+x.dist,0))+' '+UL():''].filter(Boolean).join(' · '):'ไม่ได้เล่น'));return}

/* =============== สำรองอัตโนมัติ (GitHub Gist) =============== */
const SKEY='overload-sync',GFILE='overload-data.json',GH='https://api.github.com';
let S=(()=>{try{return JSON.parse(localStorage.getItem(SKEY))||{}}catch(e){return {}}})();
const saveS=()=>{try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){}};
let syncing=false,st;
function markDirty(){try{if(!S.token)return}catch(e){return}S.dirty=true;saveS();clearTimeout(st);st=setTimeout(syncNow,3000)}
async function gh(path,opt={}){const r=await fetch(GH+path,{...opt,headers:{'Authorization':'Bearer '+S.token,'Accept':'application/vnd.github+json',...(opt.body?{'Content-Type':'application/json'}:{})},cache:'no-store'});if(!r.ok)throw new Error(r.status===401?'token ไม่ถูกต้องหรือหมดอายุ':'GitHub ตอบกลับ '+r.status);return r.status===204?null:r.json()}
const payload=()=>JSON.stringify({...D,draft:null,savedAt:new Date().toISOString()});
async function syncNow(manual){
  if(!S.token||!S.gistId||syncing)return;if(!navigator.onLine){if(manual)toast('ออฟไลน์อยู่ จะสำรองให้ตอนมีเน็ต');return}
  syncing=true;try{await gh('/gists/'+S.gistId,{method:'PATCH',body:JSON.stringify({files:{[GFILE]:{content:payload()}}})});S.dirty=false;S.last=Date.now();S.err='';saveS();if(manual)toast('สำรองแล้ว ☁️')}
  catch(e){S.err=e.message;saveS();if(manual)toast('สำรองไม่สำเร็จ: '+e.message)}
  finally{syncing=false;if(cur==='set')renderSet()}
}
async function readGist(id){const g=await gh('/gists/'+id),f=g.files[GFILE];if(!f)throw new Error('ไม่พบไฟล์สำรอง');const txt=f.truncated?await (await fetch(f.raw_url)).text():f.content;return JSON.parse(txt)}
async function connectGist(token){
  S={token:token.trim()};saveS();toast('กำลังเชื่อมต่อ…');
  try{const list=await gh('/gists?per_page=100');const found=list.find(g=>g.files&&g.files[GFILE]);
    if(found){S.gistId=found.id;saveS();const remote=await readGist(found.id);
      if(confirm(`พบข้อมูลสำรองเดิม (${remote.savedAt?new Date(remote.savedAt).toLocaleString('th-TH'):'ไม่ทราบเวลา'})\nกู้คืนข้อมูลนั้นมาแทนข้อมูลในเครื่องไหม?\n\nOK = กู้คืน · Cancel = ใช้ข้อมูลในเครื่องแล้วสำรองทับ`)){remote.draft=D.draft;D=remote;localStorage.setItem(KEY,JSON.stringify(D));S.last=Date.now();saveS();toast('กู้คืนแล้ว')}
      else await syncNow(true)}
    else{const g=await gh('/gists',{method:'POST',body:JSON.stringify({description:'Overload backup',public:false,files:{[GFILE]:{content:payload()}}})});S.gistId=g.id;S.last=Date.now();saveS();toast('เชื่อมต่อแล้ว ☁️')}
  }catch(e){S={};saveS();toast('เชื่อมต่อไม่สำเร็จ: '+e.message)}
  renderSet();
}
async function restoreGist(){if(!navigator.onLine){toast('ต้องต่อเน็ตก่อนนะ');return}if(!confirm('แทนที่ข้อมูลในเครื่องด้วยข้อมูลสำรองล่าสุด?'))return;
  try{const remote=await readGist(S.gistId);remote.draft=D.draft;D=remote;localStorage.setItem(KEY,JSON.stringify(D));S.dirty=false;saveS();toast('กู้คืนแล้ว');renderSet()}catch(e){toast('กู้คืนไม่สำเร็จ: '+e.message)}}
function autoSync(){if(S.token&&S.gistId&&(S.dirty||!S.last||Date.now()-S.last>12*3600e3))syncNow()}
addEventListener('online',autoSync);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')autoSync()});
function syncCard(){
  if(!S.token||!S.gistId)return `<div class="card"><div class="sub" style="margin-bottom:12px">สำรองข้อมูลขึ้น GitHub Gist ส่วนตัวให้อัตโนมัติทุกครั้งที่บันทึก (ตอนมีเน็ต) วาง token ที่มีสิทธิ์ gist ด้านล่าง</div>
  <input class="txt" id="gtok" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ghp_…" style="margin-bottom:10px"><button class="btn" data-act="gconnect">เชื่อมต่อ</button></div>`;
  const when=S.last?new Date(S.last).toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'–';
  const status=S.err?`⚠️ ${esc(S.err)}`:S.dirty?'⏳ รอส่ง (จะสำรองเมื่อมีเน็ต)':'✓ ข้อมูลล่าสุดสำรองแล้ว';
  return `<div class="card"><div class="ctitle"><b>เชื่อมต่อ GitHub Gist แล้ว</b><span class="sub">${when}</span></div><div class="sub" style="margin:4px 0 14px">${status}</div>
  <div style="display:flex;gap:8px"><button style="flex:1" data-act="gsync">สำรองตอนนี้</button><button style="flex:1" data-act="grestore">กู้คืน</button></div>
  <button class="link" style="width:100%;margin-top:6px" data-act="gdisc">ยกเลิกการเชื่อมต่อ</button></div>`;
}

  h+=`<button style="width:100%" data-act="addday">+ เพิ่มวัน</button>
  <div class="sec"><h3>ท่าทั้งหมด</h3></div><div class="card flat">${D.exercises.map(e=>`<div class="edrow"><span>${esc(e.name)}<br><span class="sub">${e.weighted?'มีน้ำหนัก':'ไม่มีน้ำหนัก'}</span></span><button class="mini" data-ren="${e.id}">แก้ชื่อ</button><button class="mini" data-delex="${e.id}">ลบ</button></div>`).join('')}</div>
  <div class="sec"><h3>หน่วยการวิ่ง</h3></div><div class="seg"><button data-unit="mi" class="${(D.unit||'mi')==='mi'?'on':''}">ไมล์</button><button data-unit="km" class="${D.unit==='km'?'on':''}">กิโลเมตร</button></div>
  <div class="sec"><h3>สำรองอัตโนมัติ</h3></div>${syncCard()}
  <div class="sec"><h3>สำรองเป็นไฟล์</h3></div><div class="card"><div class="sub" style="margin-bottom:12px">ข้อมูลเก็บในเครื่องนี้เท่านั้น ส่งออกไฟล์ไปเก็บใน Files หรือ iCloud ไว้เป็นระยะนะครับ</div>
  <div style="display:flex;gap:8px"><button style="flex:1" data-act="exp">ส่งออก</button><button style="flex:1" data-act="imp">นำเข้า</button></div></div>
  <p class="sub" style="text-align:center;margin-top:28px">Overload · ใช้งานออฟไลน์ได้</p>`;
  $('#p-set').innerHTML=h;
}
function newEx(){const name=(prompt('ชื่อท่าใหม่')||'').trim();if(!name)return null;const weighted=confirm('ท่านี้ใช้น้ำหนักไหม?\nOK = มีน้ำหนัก · Cancel = ไม่มี (เช่น Push up)');const e={id:uid(),name,weighted};D.exercises.push(e);return e}
$('#p-set').addEventListener('change',e=>{const t=e.target;
  if(t.dataset.dname){const d=D.days.find(x=>x.id===t.dataset.dname);d.name=t.value.trim()||d.name;save()}
  else if(t.dataset.addto){const d=D.days.find(x=>x.id===t.dataset.addto);let id=t.value;if(id==='__new'){const ex=newEx();id=ex&&ex.id}if(id){d.ex.push(id);save()}renderSet()}
});
$('#p-set').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const ds=b.dataset;
  if(ds.unit){D.unit=ds.unit;save();renderSet()}
  else if(ds.mv){const [did,i,dir]=ds.mv.split('|');const d=D.days.find(x=>x.id===did),a=+i,j=a+ +dir;if(j<0||j>=d.ex.length)return;[d.ex[a],d.ex[j]]=[d.ex[j],d.ex[a]];save();renderSet()}
  else if(ds.rm){const [did,i]=ds.rm.split('|');D.days.find(x=>x.id===did).ex.splice(+i,1);save();renderSet()}
  else if(ds.deld){if(confirm('ลบวันนี้ออกจากตาราง? (ประวัติยังอยู่)')){D.days=D.days.filter(x=>x.id!==ds.deld);save();renderSet()}}
  else if(ds.act==='addday'){D.days.push({id:uid(),name:'วัน '+(D.days.length+1),ex:[]});save();renderSet()}
  else if(ds.ren){const ex=EX(ds.ren),n=(prompt('ชื่อใหม่',ex.name)||'').trim();if(n){ex.name=n;save();renderSet()}}
  else if(ds.delex){const ex=EX(ds.delex);if(confirm(`ลบท่า "${ex.name}" และประวัติทั้งหมดของท่านี้?`)){D.exercises=D.exercises.filter(x=>x.id!==ex.id);D.sessions=D.sessions.filter(s=>s.exId!==ex.id);D.days.forEach(d=>d.ex=d.ex.filter(x=>x!==ex.id));save();renderSet()}}
  else if(ds.act==='gconnect'){const t=$('#gtok').value.trim();if(!t){toast('วาง token ก่อนนะ');return}if(!navigator.onLine){toast('ต้องต่อเน็ตก่อนนะ');return}connectGist(t)}
  else if(ds.act==='gsync')syncNow(true);
  else if(ds.act==='grestore')restoreGist();
  else if(ds.act==='gdisc'){if(confirm('ยกเลิกการเชื่อมต่อ? (ข้อมูลใน Gist ยังอยู่)')){S={};saveS();renderSet()}}
  else if(ds.act==='exp')exportData();
  else if(ds.act==='imp')$('#imp').click();
});
async function exportData(){const name='overload-backup-'+today()+'.json',file=new File([JSON.stringify(D)],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;a.click()}
$('#imp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d.exercises||!d.sessions)throw 0;if(confirm('แทนที่ข้อมูลในเครื่องด้วยไฟล์นี้?')){D=d;save();toast('นำเข้าแล้ว');renderSet()}}catch(x){toast('ไฟล์ไม่ถูกต้อง')}e.target.value=''};

/* =============== nav =============== */
const R={gym:renderGym,run:renderRun,stat:renderStat,set:renderSet};let cur='gym';
document.querySelector('nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;cur=b.dataset.t;
  document.querySelectorAll('.page').forEach(p=>p.hidden=p.id!=='p-'+cur);document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));R[cur]();updFab();scrollTo({top:0})};
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(cur==='stat')renderStat()},200)});
renderGym();autoSync();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){const had=!!navigator.serviceWorker.controller;let rl=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!rl){rl=true;location.reload()}});
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')r.update()})}).catch(()=>{})}
</script>
</body>
</html>
